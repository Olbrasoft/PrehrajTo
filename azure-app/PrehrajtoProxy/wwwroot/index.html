<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přehrávač - Prehraj.to</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
            background: linear-gradient(90deg, #e94560, #0f3460);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .search-section {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        
        .search-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.9);
            color: #333;
            font-size: 16px;
        }
        
        input[type="text"]::placeholder {
            color: #888;
        }
        
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #e94560, #0f3460);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .back-btn {
            background: rgba(255,255,255,0.2);
            margin-bottom: 20px;
        }
        
        /* Search Results */
        .results-section {
            display: none;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .movie-card {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: block;
            text-decoration: none;
            color: inherit;
        }
        
        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .movie-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: #333;
        }
        
        .movie-card .info {
            padding: 12px;
        }
        
        .movie-card .title {
            font-weight: 600;
            font-size: 14px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .movie-card .year {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }
        
        /* Player Section */
        .player-section {
            display: none;
        }
        
        .video-container {
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        video {
            width: 100%;
            height: 100%;
        }
        
        .now-playing {
            margin-top: 15px;
            font-size: 18px;
            font-weight: 600;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        
        .status.error {
            display: block;
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid #e94560;
        }
        
        .status.success {
            display: block;
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71;
        }
        
        .status.loading {
            display: block;
            background: rgba(52, 152, 219, 0.2);
            border: 1px solid #3498db;
        }
        
        .placeholder {
            color: #666;
            text-align: center;
            padding: 40px;
        }
        
        .placeholder p {
            margin: 10px 0;
        }

        .results-info {
            color: #888;
            margin-top: 10px;
        }

        .dedication {
            margin-top: 60px;
            padding: 30px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            text-align: center;
            color: #aaa;
            font-style: italic;
            line-height: 1.8;
        }

        .dedication .heart {
            color: #e94560;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .dedication .main-text {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .dedication .location {
            font-size: 14px;
            color: #888;
            margin-bottom: 15px;
        }

        .dedication .ps {
            font-size: 14px;
            color: #ccc;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.5em; }
            .search-group { flex-direction: column; }
            button { width: 100%; }
            .results-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Přehrávač Prehraj.to</h1>
        
        <!-- Search Section -->
        <div id="searchSection" class="search-section">
            <div class="search-group">
                <input type="text" id="searchInput" 
                       placeholder="Hledej film nebo seriál (např. Matrix, Angelika, Piráti z Karibiku...)"
                       autocomplete="off">
                <button id="searchBtn" onclick="searchMovies()">🔍 Hledat</button>
            </div>
        </div>
        
        <div id="status" class="status"></div>
        
        <!-- Results Section -->
        <div id="resultsSection" class="results-section">
            <div id="resultsInfo" class="results-info"></div>
            <div id="resultsGrid" class="results-grid"></div>
        </div>
        
        <!-- Player Section -->
        <div id="playerSection" class="player-section">
            <button class="back-btn" onclick="goBack()">← Zpět na výsledky</button>
            <div class="video-container">
                <video id="videoPlayer" controls></video>
            </div>
            <div id="nowPlaying" class="now-playing"></div>
        </div>
        
        <!-- Initial Placeholder -->
        <div id="placeholder" class="placeholder">
            <p style="font-size: 48px;">🔍</p>
            <p>Zadej název filmu nebo seriálu a klikni na Hledat</p>
        </div>

        <!-- Dedication -->
        <div class="dedication">
            <div class="heart">❤️</div>
            <div class="main-text">Mamince a Leničce věnuje Jiříček a jeho virtuální asistent</div>
            <div class="location">V Olbramovicích dne 6. prosince 2025</div>
            <div class="ps">PS: Mám vás moc rád, i když to asi neumím dávat dobře znát.</div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const status = document.getElementById('status');
        const resultsSection = document.getElementById('resultsSection');
        const resultsGrid = document.getElementById('resultsGrid');
        const resultsInfo = document.getElementById('resultsInfo');
        const playerSection = document.getElementById('playerSection');
        const videoPlayer = document.getElementById('videoPlayer');
        const nowPlaying = document.getElementById('nowPlaying');
        const placeholder = document.getElementById('placeholder');
        
        let currentResults = [];
        
        // Check URL params on load - for direct video links
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const videoUrl = params.get('watch');
            const title = params.get('title') || 'Video';
            const searchQuery = params.get('q');
            
            if (videoUrl) {
                // Direct video link - load and play
                playVideoDirectly(videoUrl, title);
            } else if (searchQuery) {
                // Search query in URL
                searchInput.value = searchQuery;
                searchMovies();
            }
        });
        
        // Enter key to search
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchMovies();
        });
        
        function showStatus(message, type) {
            status.className = 'status ' + type;
            status.textContent = message;
        }
        
        function hideStatus() {
            status.className = 'status';
            status.textContent = '';
        }
        
        function showSection(section) {
            placeholder.style.display = 'none';
            resultsSection.style.display = 'none';
            playerSection.style.display = 'none';
            
            if (section === 'results') {
                resultsSection.style.display = 'block';
            } else if (section === 'player') {
                playerSection.style.display = 'block';
            } else {
                placeholder.style.display = 'block';
            }
        }
        
        async function searchMovies() {
            const query = searchInput.value.trim();
            
            if (!query) {
                showStatus('❌ Zadej název filmu nebo seriálu', 'error');
                return;
            }
            
            // Update URL with search query
            const newUrl = `${window.location.pathname}?q=${encodeURIComponent(query)}`;
            window.history.pushState({}, '', newUrl);
            
            searchBtn.disabled = true;
            searchBtn.textContent = '⏳ Hledám...';
            showStatus('🔄 Vyhledávám na prehraj.to...', 'loading');
            
            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                if (data.success && data.movies && data.movies.length > 0) {
                    currentResults = data.movies;
                    hideStatus();
                    displayResults(data.movies, query);
                } else if (data.success && (!data.movies || data.movies.length === 0)) {
                    showStatus(`❌ Nic nenalezeno pro "${query}"`, 'error');
                    showSection('placeholder');
                } else {
                    showStatus(`❌ ${data.error || 'Chyba při vyhledávání'}`, 'error');
                    showSection('placeholder');
                }
            } catch (error) {
                console.error('Search error:', error);
                showStatus(`❌ Chyba připojení: ${error.message}`, 'error');
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = '🔍 Hledat';
            }
        }
        
        function displayResults(movies, query) {
            resultsInfo.textContent = `Nalezeno ${movies.length} výsledků pro "${query}" (ověřuji dostupnost...)`;
            resultsGrid.innerHTML = '';
            
            // Store card elements by index for later removal
            const cardElements = [];
            
            movies.forEach((movie, index) => {
                const card = document.createElement('a');
                card.className = 'movie-card';
                card.dataset.index = index;
                card.href = `?watch=${encodeURIComponent(movie.url)}&title=${encodeURIComponent(movie.title)}`;
                // Allow middle-click / ctrl+click to open in new tab
                card.onclick = (e) => {
                    if (!e.ctrlKey && !e.metaKey && e.button === 0) {
                        e.preventDefault();
                        playMovie(index);
                    }
                };
                
                card.innerHTML = `
                    <img src="${movie.thumbnail || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 9%22><rect fill=%22%23333%22 width=%2216%22 height=%229%22/><text x=%228%22 y=%225%22 fill=%22%23666%22 text-anchor=%22middle%22 font-size=%222%22>🎬</text></svg>'}" 
                         alt="${movie.title}"
                         onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 9%22><rect fill=%22%23333%22 width=%2216%22 height=%229%22/><text x=%228%22 y=%225%22 fill=%22%23666%22 text-anchor=%22middle%22 font-size=%222%22>🎬</text></svg>'">
                    <div class="info">
                        <div class="title">${movie.title}</div>
                        ${movie.year ? `<div class="year">${movie.year}</div>` : ''}
                    </div>
                `;
                
                resultsGrid.appendChild(card);
                cardElements[index] = card;
            });
            
            showSection('results');
            
            // Validate videos in background and remove invalid ones
            validateMoviesInBackground(movies, query, cardElements);
        }
        
        async function validateMoviesInBackground(movies, query, cardElements) {
            let validCount = movies.length;
            let checkedCount = 0;
            
            // Validate in parallel, but limit concurrency
            const concurrency = 5;
            const chunks = [];
            for (let i = 0; i < movies.length; i += concurrency) {
                chunks.push(movies.slice(i, i + concurrency).map((m, idx) => ({ movie: m, index: i + idx })));
            }
            
            for (const chunk of chunks) {
                await Promise.all(chunk.map(async ({ movie, index }) => {
                    try {
                        const response = await fetch(`/api/validate?url=${encodeURIComponent(movie.url)}`);
                        const data = await response.json();
                        
                        checkedCount++;
                        
                        if (!data.valid) {
                            // Remove invalid video from display
                            const card = cardElements[index];
                            if (card && card.parentNode) {
                                card.remove();
                                validCount--;
                                
                                // Also remove from currentResults
                                const resultIndex = currentResults.findIndex(m => m.url === movie.url);
                                if (resultIndex > -1) {
                                    currentResults.splice(resultIndex, 1);
                                }
                            }
                        }
                        
                        // Update info text
                        resultsInfo.textContent = `Nalezeno ${validCount} funkčních výsledků pro "${query}" (ověřeno ${checkedCount}/${movies.length})`;
                        
                    } catch (err) {
                        console.error('Validation error:', err);
                        checkedCount++;
                    }
                }));
            }
            
            // Final update
            resultsInfo.textContent = `Nalezeno ${validCount} funkčních výsledků pro "${query}"`;
            
            if (validCount === 0) {
                showStatus(`❌ Žádné funkční video nenalezeno pro "${query}"`, 'error');
            }
        }
        
        async function playVideoDirectly(prehrajtoUrl, title) {
            showStatus('🔄 Načítám video...', 'loading');
            showSection('player');
            nowPlaying.textContent = decodeURIComponent(title);
            
            try {
                const response = await fetch(`/api/proxy?url=${encodeURIComponent(prehrajtoUrl)}`);
                const data = await response.json();
                
                if (data.success && data.videoUrl) {
                    hideStatus();
                    videoPlayer.src = data.videoUrl;
                    
                    try {
                        await videoPlayer.play();
                    } catch (playError) {
                        showStatus('✅ Video připraveno. Klikni na přehrávač pro spuštění.', 'success');
                    }
                } else {
                    showStatus(`❌ ${data.error || 'Video se nepodařilo načíst'}`, 'error');
                }
            } catch (error) {
                console.error('Play error:', error);
                showStatus(`❌ Chyba: ${error.message}`, 'error');
            }
        }
        
        async function playMovie(index) {
            const movie = currentResults[index];
            
            // Update URL to video page
            const newUrl = `?watch=${encodeURIComponent(movie.url)}&title=${encodeURIComponent(movie.title)}`;
            window.history.pushState({}, '', newUrl);
            
            showStatus('🔄 Načítám video...', 'loading');
            
            try {
                const response = await fetch(`/api/proxy?url=${encodeURIComponent(movie.url)}`);
                const data = await response.json();
                
                if (data.success && data.videoUrl) {
                    hideStatus();
                    nowPlaying.textContent = movie.title;
                    videoPlayer.src = data.videoUrl;
                    showSection('player');
                    
                    try {
                        await videoPlayer.play();
                    } catch (playError) {
                        showStatus('✅ Video připraveno. Klikni na přehrávač pro spuštění.', 'success');
                    }
                } else {
                    showStatus(`❌ ${data.error || 'Video se nepodařilo načíst'}`, 'error');
                }
            } catch (error) {
                console.error('Play error:', error);
                showStatus(`❌ Chyba: ${error.message}`, 'error');
            }
        }
        
        function goBack() {
            stopVideo();
            hideStatus();
            
            // Go back to search results if we have them
            if (currentResults.length > 0) {
                const query = searchInput.value.trim();
                const newUrl = query ? `?q=${encodeURIComponent(query)}` : window.location.pathname;
                window.history.pushState({}, '', newUrl);
                showSection('results');
            } else {
                window.history.pushState({}, '', window.location.pathname);
                showSection('placeholder');
            }
        }
        
        // Handle browser back/forward
        window.addEventListener('popstate', () => {
            const params = new URLSearchParams(window.location.search);
            const videoUrl = params.get('watch');
            const title = params.get('title');
            const searchQuery = params.get('q');
            
            // Always stop video first when navigating
            stopVideo();
            
            if (videoUrl) {
                playVideoDirectly(videoUrl, title || 'Video');
            } else if (searchQuery) {
                searchInput.value = searchQuery;
                if (currentResults.length > 0) {
                    showSection('results');
                } else {
                    searchMovies();
                }
            } else {
                hideStatus();
                showSection('placeholder');
            }
        });
        
        // Stop and cleanup video player
        function stopVideo() {
            if (videoPlayer) {
                videoPlayer.pause();
                videoPlayer.src = '';
                videoPlayer.load(); // Force release of media resources
            }
        }
    </script>
</body>
</html>
